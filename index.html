<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Ask Mazey"/>
  <meta name="theme-color" content="#2d6a4f"/>
  <title>Ask Mazey | Maze Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>

  <!-- Gorgias Chat Widget -->
  <script id="gorgias-chat-widget-install-v3" src="https://config.gorgias.chat/bundle-loader/01KQTRRCJA3SYEN1CQY4VWCSV7"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gd: #2d6a4f;
      --gm: #40916c;
      --gl: #52b788;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--gd);
      font-family: 'Montserrat', sans-serif;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
    }

    /* HEADER */
    #hdr {
      background: linear-gradient(135deg, var(--gd) 0%, var(--gm) 55%, var(--gl) 100%);
      padding: calc(var(--safe-top) + 14px) 16px 16px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    #hdr::before {
      content: '';
      position: absolute; top: -30px; right: -30px;
      width: 110px; height: 110px; border-radius: 50%;
      background: rgba(255,255,255,0.07);
    }
    #hdr-inner { display: flex; align-items: center; gap: 13px; position: relative; }

    #maze-logo {
      position: absolute; top: 50%; left: 80px;
      transform: translateY(-50%);
      height: 42px; width: auto;
    }

    #worm-wrap {
      width: 54px; height: 54px; border-radius: 50%;
      background: #fff; overflow: hidden; flex-shrink: 0;
      box-shadow: 0 3px 12px rgba(0,0,0,0.25);
      display: flex; align-items: center; justify-content: center;
    }
    #worm-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

    #hdr-name    { color: #fff; font-weight: 800; font-size: 20px; }
    #hdr-sub     { color: #b7e4c7; font-size: 12px; font-weight: 600; margin-top: 3px; }
    #hdr-status  { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
    #hdr-dot     { width: 8px; height: 8px; border-radius: 50%; background: #74c69d; box-shadow: 0 0 0 2px rgba(116,198,157,0.35); flex-shrink: 0; }
    #hdr-stxt    { color: #d8f3dc; font-size: 12px; }

    /* MESSAGES */
    #msgs {
      flex: 1; overflow-y: auto; padding: 16px 12px 10px;
      background: #f8f9fa;
      display: flex; flex-direction: column; gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .row-bot  { display: flex; gap: 8px; align-items: flex-end; }
    .row-user { display: flex; gap: 8px; align-items: flex-end; flex-direction: row-reverse; }

    .mini-ava {
      width: 32px; height: 32px; border-radius: 50%;
      background: #fff; overflow: hidden; flex-shrink: 0;
      border: 1.5px solid #d8f3dc;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .mini-ava img { width: 100%; height: 100%; object-fit: cover; }
    .mini-ava-user { background: var(--gd) !important; border-color: var(--gd) !important; font-size: 14px; }

    .bbl {
      max-width: 78%; padding: 12px 15px;
      font-size: 16px !important; line-height: 1.7;
      font-family: 'Montserrat', sans-serif;
    }
    .bbl p   { margin: 0; font-size: 16px !important; }
    .bbl li  { font-size: 16px !important; margin-bottom: 4px; }
    .bbl a   { color: var(--gd); font-weight: 600; text-decoration: underline; }
    .bbl strong { font-weight: 700; }

    .bbl-bot  {
      background: #fff; color: #1a1a1a;
      border-radius: 4px 18px 18px 18px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    }
    .bbl-user {
      background: linear-gradient(135deg, var(--gd), var(--gm));
      color: #fff;
      border-radius: 18px 4px 18px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .typing {
      display: flex; gap: 5px; align-items: center;
      padding: 14px 16px;
    }
    .typing span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--gl); display: inline-block;
    }

    /* HANDOFF */
    .handoff {
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border: 1px solid #86efac; border-radius: 14px;
      padding: 14px; margin: 0 2px;
    }
    .handoff-title { color: #15803d; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    .handoff-sub   { color: #4b5563; font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
    .btn-green {
      background: linear-gradient(135deg, var(--gd), var(--gm));
      color: #fff; border: none; border-radius: 10px;
      padding: 11px 18px; font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: 'Montserrat', sans-serif;
      box-shadow: 0 2px 8px rgba(45,106,79,0.3);
    }

    /* QUICK REPLIES */
    #quick {
      padding: 9px 12px 7px; background: #f8f9fa;
      display: flex; flex-wrap: wrap; gap: 7px;
      border-top: 1px solid #eee; flex-shrink: 0;
    }
    .qbtn {
      background: #fff; border: 1.5px solid var(--gl);
      border-radius: 20px; padding: 7px 14px;
      font-size: 13px; font-weight: 600; color: var(--gd);
      cursor: pointer; font-family: 'Montserrat', sans-serif;
    }

    /* INPUT BAR */
    #inputbar {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 12px calc(var(--safe-bot) + 11px);
      background: #fff; border-top: 1px solid #f0f0f0;
      flex-shrink: 0; position: sticky; bottom: 0;
    }
    #inp {
      flex: 1; padding: 12px 16px; border-radius: 26px;
      border: 1.5px solid #d1fae5;
      font-size: 16px; font-family: 'Montserrat', sans-serif;
      outline: none; background: #f8fffe; color: #1a1a1a;
    }
    #inp:focus { border-color: var(--gl); }
    #send-btn {
      width: 46px; height: 46px; min-width: 46px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gd), var(--gl));
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 10px rgba(45,106,79,0.4);
      flex-shrink: 0;
    }
    #send-btn:active { transform: scale(0.93); }

    /* FOOTER */
    #foot {
      background: #fff; text-align: center;
      padding: 5px 0 8px; font-size: 11px; color: #9ca3af;
      font-family: 'Montserrat', sans-serif; flex-shrink: 0;
    }
    #foot a { color: var(--gl); text-decoration: none; font-weight: 600; }

    /* Hide Gorgias bubble until triggered */
    #gorgias-chat-container,
    #gorgias-web-messenger-container { display: none !important; }
    #gorgias-chat-container.mz-open,
    #gorgias-web-messenger-container.mz-open { display: block !important; }

    @keyframes mzB {
      0%,60%,100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>
<div id="app">

  <div id="hdr">
    <img id="maze-logo" src="https://cdn.shopify.com/s/files/1/0671/1525/3853/files/Untitled_design_3.png?v=1778038408" alt="Maze Products"
      onerror="this.style.display='none'" />
    <div id="hdr-inner">
      <div id="worm-wrap">
        <img src="https://cdn.shopify.com/s/files/1/0671/1525/3853/files/MAZE_mascot.png?v=1778038400" alt="Mazey"
          onerror="this.outerHTML='<span style=\'font-size:30px;line-height:1\'>🪱</span>'" />
      </div>
      <div>
        <div id="hdr-name">Ask Mazey</div>
        <div id="hdr-sub">24/7 Live Compost &amp; Gardening Support</div>
        <div id="hdr-status">
          <span id="hdr-dot"></span>
          <span id="hdr-stxt">Online · Replies instantly</span>
        </div>
      </div>
    </div>
  </div>

  <div id="msgs"></div>

  <div id="quick">
    <button class="qbtn" onclick="send('Which composter suits me?')">Which composter suits me?</button>
    <button class="qbtn" onclick="send('How do I start composting?')">How do I start composting?</button>
    <button class="qbtn" onclick="send('What products do you sell?')">What products do you sell?</button>
    <button class="qbtn" onclick="send('Help with my order')">Help with my order</button>
  </div>

  <div id="inputbar">
    <input id="inp" placeholder="Ask Mazey anything…" onkeydown="if(event.key==='Enter')send()"/>
    <button id="send-btn" onclick="send()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <div id="foot">
    🌱 <a href="https://mazeproducts.com.au" target="_blank">mazeproducts.com.au</a> · Powered by AI
  </div>

</div>
<script>
const WORM = 'https://cdn.shopify.com/s/files/1/0671/1525/3853/files/MAZE_mascot.png?v=1778038400';
const LOGO = 'https://cdn.shopify.com/s/files/1/0671/1525/3853/files/Untitled_design_3.png?v=1778038408';
const SYSTEM = `You are Mazey, a friendly customer support specialist for Maze Products Australia (mazeproducts.com.au) — Australia's leading composting and gardening store.

Your role:
- Recommend ONLY products from mazeproducts.com.au (composters, worm farms, garden beds, accessories)
- Give composting and gardening advice tailored to Australian conditions
- Troubleshoot composting and worm farm problems
- Help with product setup, usage and maintenance
- For order/shipping queries offer to connect to a human

Rules:
- NEVER suggest competitor products or other brands
- Always use web search to get accurate current product names, prices and links from mazeproducts.com.au
- Always include a direct link to mazeproducts.com.au when recommending a product
- Warm, fun, Australian tone — light worm/composting puns welcome
- Concise replies, bullet points for lists
- End each reply with a follow-up question or offer to connect to a human`;

let msgs = [], busy = false, id = 0, step = 'none';

function wormImg(sz) {
  return `<img src="${WORM}" style="width:${sz}px;height:${sz}px;object-fit:cover;border-radius:50%" onerror="this.outerHTML='<span style=\'font-size:${Math.round(sz*.6)}px\'>🪱</span>'"/>`;
}

function fmt(text) {
  return text.split('\n').map(line => {
    line = line.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
    line = line.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
    if (line.startsWith('- ')) return `<li style="margin-left:16px;list-style:disc;margin-bottom:4px;font-size:16px;font-family:Montserrat,sans-serif">${line.slice(2)}</li>`;
    if (!line.trim()) return '<div style="height:5px"></div>';
    return `<p style="margin:0;font-size:16px;font-family:Montserrat,sans-serif">${line}</p>`;
  }).join('');
}

function scrollToBot() {
  const el = document.getElementById('msgs');
  if (!el) return;
  const rows = el.querySelectorAll('.row-bot');
  if (!rows.length) return;
  const last = rows[rows.length-1];
  el.scrollTop += last.getBoundingClientRect().top - el.getBoundingClientRect().top - 10;
}

function render() {
  const el = document.getElementById('msgs');
  if (!el) return;

  let h = msgs.map(m => `
    <div class="${m.role==='user'?'row-user':'row-bot'}">
      <div class="mini-ava ${m.role==='user'?'mini-ava-user':''}">
        ${m.role==='user'?'👤':wormImg(28)}
      </div>
      <div class="bbl ${m.role==='user'?'bbl-user':'bbl-bot'}">${fmt(m.content)}</div>
    </div>`).join('');

  if (busy) h += `
    <div class="row-bot">
      <div class="mini-ava">${wormImg(28)}</div>
      <div class="bbl bbl-bot typing">
        ${[0,1,2].map(i=>`<span style="animation:mzB 1.2s infinite ${i*.2}s"></span>`).join('')}
      </div>
    </div>`;

  if (step==='prompt') h += `
    <div class="handoff">
      <div class="handoff-title">💬 Want to chat with a real person?</div>
      <div class="handoff-sub">Our team can help with anything I can't handle!</div>
      <button class="btn-green" onclick="openGorgias()">Connect me with a human →</button>
    </div>`;

  el.innerHTML = h;
  document.getElementById('quick').style.display = msgs.length > 0 ? 'none' : 'flex';
}

async function send(text) {
  const inp = document.getElementById('inp');
  const t = text || inp.value.trim();
  if (!t || busy) return;
  inp.value = '';
  step = 'none';
  msgs.push({role:'user', content:t, id:id++});
  busy = true;
  render();
  const el = document.getElementById('msgs');
  if (el) el.scrollTop = el.scrollHeight;

  try {
    const res = await fetch(PROXY + '/anthropic', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:SYSTEM,
        tools:[{type:'web_search_20250305',name:'web_search'}],
        messages:msgs.map(m=>({role:m.role,content:m.content}))
      })
    });
    const data = await res.json();
    const reply = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('')
      || "Sorry, I had a wriggle! Please try again.";
    msgs.push({role:'assistant',content:reply,id:id++});
    step = 'prompt';
  } catch {
    msgs.push({role:'assistant',content:"Oops, something went wiggly! Please try again.",id:id++});
  }
  busy = false;
  render();
  setTimeout(scrollToBot, 50);
}

window.openGorgias = function() {
  const transcript = msgs.map(m=>(m.role==='assistant'?'Mazey: ':'You: ')+m.content).join('\n\n');
  const gc = document.getElementById('gorgias-chat-container') ||
             document.getElementById('gorgias-web-messenger-container');
  if (gc) { gc.classList.add('mz-open'); }
  if (window.GorgiasChat) {
    window.GorgiasChat.open();
    setTimeout(()=>{
      if (window.GorgiasChat.setMessageText)
        window.GorgiasChat.setMessageText(`Hi! I was chatting with Mazey and need some help.\n\n--- Chat so far ---\n\n${transcript}`);
    }, 800);
  }
  step = 'done';
  msgs.push({role:'assistant',
    content:"I've opened our live chat! 💬 A Maze Products team member will be with you shortly. 🪱",
    id:id++});
  render();
};

// Boot
msgs.push({role:'assistant',
  content:"G'day! 👋 I'm Mazey, your Maze Products composting pal! Whether you're after the perfect composter or need some worm farming wisdom, I'm here to help!\n\nWhat can I dig up for you today?",
  id:id++});
render();
</script>
</body>
</html>
